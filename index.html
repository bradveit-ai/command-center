<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0d;
  --surface: #171715;
  --surface2: #1e1e1b;
  --border: #272722;
  --border2: #323229;
  --text: #e8e3d8;
  --dim: #a8a39a;
  --faint: #6b6860;
  --chalk: #f5f2ec;
  --amber: #c8872a;
  --amber-dim: #6b4a18;
  --amber-glow: rgba(200,135,42,0.07);
  --green: #5a9966;
  --green-dim: #2e5238;
  --red: #9c4a4a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  height: 100vh;
  overflow: hidden;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 9999;
}

.app { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }
.sidebar { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.main-col { display: flex; flex-direction: column; overflow: hidden; }

.top-bar {
  padding: 8px 14px 6px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: baseline; gap: 10px; flex-shrink: 0;
}
.logo { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 0.18em; color: var(--chalk); }
.hdate { color: var(--dim); font-size: 10px; letter-spacing: 0.1em; }
.anchor { margin-left: auto; font-family: 'Lora', serif; font-style: italic; color: var(--amber); font-size: 10px; opacity: 0.6; }

.sync-bar {
  padding: 3px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  font-size: 9px; letter-spacing: 0.1em; color: var(--dim);
  cursor: default;
}
.sync-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--dim); flex-shrink: 0; transition: background 0.3s;
}
.sync-dot.ok { background: var(--green); }
.sync-dot.err { background: var(--red); }
.sync-dot.syncing { animation: pulse 1s infinite; background: var(--amber); }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }

.sec-head {
  padding: 5px 14px 4px;
  font-family: 'Bebas Neue', sans-serif; font-size: 10px; letter-spacing: 0.24em;
  color: var(--dim); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.sec-head .badge { margin-left: auto; font-family: 'DM Mono', monospace; font-size: 9px; color: var(--faint); }

.timer-wrap { padding: 10px 14px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.timer-num {
  font-family: 'Bebas Neue', sans-serif; font-size: 48px; letter-spacing: 0.04em;
  color: var(--chalk); line-height: 1; text-align: center; margin-bottom: 2px; transition: color 0.3s;
}
.timer-num.running { color: var(--amber); }
.timer-num.done { color: var(--green); }
.timer-focus-lbl {
  text-align: center; font-family: 'Lora', serif; font-style: italic;
  color: var(--dim); font-size: 10px; min-height: 12px; margin-bottom: 8px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 8px;
}
.presets { display: flex; gap: 4px; justify-content: center; margin-bottom: 8px; }
.pre-btn {
  background: var(--surface); border: 1px solid var(--border2); color: var(--dim);
  font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.06em;
  padding: 3px 8px; border-radius: 2px; cursor: pointer; transition: all 0.15s;
}
.pre-btn:hover,.pre-btn.on { border-color: var(--amber-dim); color: var(--amber); background: var(--amber-glow); }
.t-controls { display: flex; gap: 5px; justify-content: center; margin-bottom: 8px; }
.t-btn {
  font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 0.1em;
  padding: 5px 12px; border-radius: 2px; cursor: pointer; border: 1px solid; transition: all 0.15s;
}
.t-start { background: var(--amber-glow); border-color: var(--amber-dim); color: var(--amber); }
.t-start:hover { background: rgba(200,135,42,0.14); }
.t-pause { background: var(--surface); border-color: var(--border2); color: var(--dim); }
.t-pause:hover { border-color: var(--amber-dim); color: var(--amber); }
.t-reset { background: transparent; border-color: var(--border); color: var(--faint); }
.t-reset:hover { color: var(--dim); border-color: var(--border2); }
.t-task-in {
  width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 2px;
  color: var(--chalk); font-family: 'Lora', serif; font-style: italic; font-size: 11px;
  padding: 5px 10px; outline: none; transition: border-color 0.15s; margin-bottom: 6px;
}
.t-task-in:focus { border-color: var(--amber-dim); }
.t-task-in::placeholder { color: var(--faint); }
.t-bar { height: 2px; background: var(--surface2); border-radius: 1px; overflow: hidden; }
.t-fill { height: 100%; background: var(--amber); width: 0%; transition: width 1s linear; }

.task-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 120px; }
.task-add { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.task-in {
  flex: 1; background: var(--surface2); border: none; border-right: 1px solid var(--border);
  color: var(--chalk); font-family: 'DM Mono', monospace; font-size: 11px; padding: 8px 12px; outline: none;
}
.task-in::placeholder { color: var(--faint); }
.task-in:focus { background: var(--surface); }
.btn-add-t {
  background: transparent; border: none; color: var(--dim); font-family: 'Bebas Neue', sans-serif;
  font-size: 18px; padding: 0 12px; cursor: pointer; transition: color 0.15s;
}
.btn-add-t:hover { color: var(--amber); }
.task-scroll { flex: 1; overflow-y: auto; min-height: 0; }
.task-item {
  display: flex; align-items: flex-start; gap: 8px; padding: 5px 14px;
  border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; transition: background 0.1s;
}
.task-item:hover { background: var(--surface); }
.task-item.done { opacity: 0.3; }
.t-chk {
  width: 12px; height: 12px; border: 1px solid var(--border2); border-radius: 2px;
  flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.task-item.done .t-chk { background: var(--green-dim); border-color: var(--green); }
.t-chk::after {
  content: ''; width: 6px; height: 3px;
  border-left: 1.5px solid var(--green); border-bottom: 1.5px solid var(--green);
  transform: rotate(-45deg) translateY(-1px); opacity: 0; transition: opacity 0.1s;
}
.task-item.done .t-chk::after { opacity: 1; }
.t-name { flex: 1; font-size: 11px; color: var(--text); line-height: 1.4; }
.task-item.done .t-name { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--faint); }
.t-focus-btn {
  opacity: 0; background: transparent; border: 1px solid var(--amber-dim); color: var(--amber);
  font-family: 'DM Mono', monospace; font-size: 8px; letter-spacing: 0.08em;
  padding: 2px 5px; cursor: pointer; border-radius: 2px; flex-shrink: 0; transition: all 0.15s;
}
.task-item:hover .t-focus-btn { opacity: 1; }
.t-del {
  opacity: 0; color: var(--dim); font-size: 12px; cursor: pointer;
  padding: 0 2px; transition: opacity 0.1s; flex-shrink: 0;
}
.task-item:hover .t-del { opacity: 0.35; }
.t-del:hover { opacity: 1 !important; color: var(--red) !important; }
.task-foot { padding: 6px 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
.btn-clear-t {
  background: transparent; border: 1px solid var(--border); color: var(--faint);
  font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.06em;
  padding: 3px 8px; border-radius: 2px; cursor: pointer; transition: all 0.15s;
}
.btn-clear-t:hover { color: var(--dim); border-color: var(--border2); }

.move-strip { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.m-stat { flex: 1; padding: 7px 12px; border-right: 1px solid var(--border); }
.m-stat:last-child { border-right: none; flex: 2; }
.m-lbl { font-size: 9px; letter-spacing: 0.16em; color: var(--dim); text-transform: uppercase; margin-bottom: 3px; }
.m-in {
  width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border2);
  color: var(--chalk); font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 0.03em;
  outline: none; padding-bottom: 1px; transition: border-color 0.15s;
}
.m-in:focus { border-bottom-color: var(--amber); }
.m-in::placeholder { color: var(--faint); }
.m-unit { font-size: 9px; color: var(--faint); margin-top: 2px; letter-spacing: 0.1em; }

.sleep-wrap { padding: 8px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sleep-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.sl-field label { display: block; font-size: 9px; letter-spacing: 0.14em; color: var(--dim); text-transform: uppercase; margin-bottom: 3px; }
.sl-field input {
  width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 2px;
  color: var(--chalk); font-family: 'Bebas Neue', sans-serif; font-size: 15px;
  padding: 3px 7px; outline: none; transition: border-color 0.15s;
}
.sl-field input:focus { border-color: var(--amber-dim); }
.sl-field input::placeholder { color: var(--faint); }
.q-row { display: flex; align-items: center; gap: 4px; margin-bottom: 7px; }
.q-lbl { font-size: 9px; letter-spacing: 0.14em; color: var(--dim); text-transform: uppercase; margin-right: 2px; }
.q-dot {
  width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border2);
  background: var(--surface); cursor: pointer; font-size: 10px;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.q-dot:hover { border-color: var(--amber-dim); }
.q-dot.on { border-color: var(--amber); background: var(--amber-glow); }
.sl-bot { display: flex; gap: 6px; }
.sl-note {
  flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 2px;
  color: var(--text); font-family: 'DM Mono', monospace; font-size: 11px;
  padding: 4px 8px; outline: none; resize: none; transition: border-color 0.15s;
}
.sl-note:focus { border-color: var(--amber-dim); }
.sl-note::placeholder { color: var(--faint); font-style: italic; }
.btn-log-sl {
  background: transparent; border: 1px solid var(--amber-dim); color: var(--amber);
  font-family: 'Bebas Neue', sans-serif; font-size: 11px; letter-spacing: 0.1em;
  padding: 0 9px; cursor: pointer; border-radius: 2px; transition: background 0.15s; white-space: nowrap;
}
.btn-log-sl:hover { background: var(--amber-glow); }
.sl-history { margin-top: 6px; }
.sl-rec {
  display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--border);
  align-items: center; font-size: 10px;
}
.sl-rec:last-child { border-bottom: none; }
.sl-dt { color: var(--faint); min-width: 52px; }
.sl-h { color: var(--green); font-family: 'Bebas Neue'; font-size: 14px; }
.sl-q { font-size: 11px; }
.sl-n { color: var(--dim); font-style: italic; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sl-x { cursor: pointer; color: var(--faint); opacity: 0.4; font-size: 11px; }
.sl-x:hover { opacity: 1; color: var(--red); }

.chores-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
.chore-add-row { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.chore-in {
  flex: 1; background: var(--surface2); border: none; border-right: 1px solid var(--border);
  color: var(--chalk); font-family: 'DM Mono', monospace; font-size: 11px; padding: 8px 12px; outline: none;
}
.chore-in::placeholder { color: var(--faint); }
.chore-in:focus { background: var(--surface); }
.btn-add-c {
  background: transparent; border: none; color: var(--dim); font-family: 'Bebas Neue', sans-serif;
  font-size: 18px; padding: 0 12px; cursor: pointer; transition: color 0.15s;
}
.btn-add-c:hover { color: var(--amber); }
.chore-scroll { flex: 1; overflow-y: auto; min-height: 0; }
.chore-list { list-style: none; padding: 4px 0; }
.chore-item {
  display: flex; align-items: center; gap: 8px; padding: 5px 14px;
  border-bottom: 1px solid var(--border); user-select: none; transition: background 0.1s, opacity 0.15s;
}
.chore-item:last-child { border-bottom: none; }
.chore-item:hover { background: var(--surface); }
.chore-item.done { opacity: 0.3; }
.chore-item.dragging { opacity: 0.4; background: var(--surface2); }
.chore-item.drag-over { border-top: 2px solid var(--amber); }
.drag-handle {
  color: var(--faint); cursor: grab; flex-shrink: 0;
  display: flex; flex-direction: column; gap: 2px; padding: 2px; transition: color 0.15s;
}
.drag-handle:active { cursor: grabbing; }
.chore-item:hover .drag-handle { color: var(--dim); }
.drag-handle span { display: block; width: 10px; height: 1px; background: currentColor; border-radius: 1px; }
.c-chk {
  width: 12px; height: 12px; border: 1px solid var(--border2); border-radius: 2px;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s;
}
.chore-item.done .c-chk { background: var(--green-dim); border-color: var(--green); }
.c-chk::after {
  content: ''; width: 6px; height: 3px;
  border-left: 1.5px solid var(--green); border-bottom: 1.5px solid var(--green);
  transform: rotate(-45deg) translateY(-1px); opacity: 0; transition: opacity 0.1s;
}
.chore-item.done .c-chk::after { opacity: 1; }
.c-name { flex: 1; font-size: 11px; color: var(--text); cursor: pointer; line-height: 1.4; }
.chore-item.done .c-name { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--faint); }
.c-del {
  opacity: 0; color: var(--dim); font-size: 12px; cursor: pointer; padding: 0 2px; transition: opacity 0.1s; flex-shrink: 0;
}
.chore-item:hover .c-del { opacity: 0.35; }
.c-del:hover { opacity: 1 !important; color: var(--red) !important; }
.chore-foot {
  padding: 6px 16px; border-top: 1px solid var(--border); flex-shrink: 0;
  display: flex; gap: 8px; align-items: center;
}
.btn-clear-c {
  background: transparent; border: 1px solid var(--border); color: var(--faint);
  font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.06em;
  padding: 3px 8px; border-radius: 2px; cursor: pointer; transition: all 0.15s;
}
.btn-clear-c:hover { color: var(--dim); border-color: var(--border2); }
.chore-hint { color: var(--faint); font-size: 9px; letter-spacing: 0.06em; margin-left: auto; }

/* PANDORA */
.pandora-panel {
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}
.pandora-btn {
  display: flex;
  align-items: center;
  gap: 9px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 3px;
  padding: 8px 14px;
  color: var(--text);
  text-decoration: none;
  transition: border-color 0.15s, background 0.15s;
  cursor: pointer;
  flex: 1;
}
.pandora-btn:hover {
  border-color: var(--amber-dim);
  background: var(--amber-glow);
  color: var(--amber);
}
.pandora-icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  color: var(--amber);
}
.pandora-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: 0.12em;
}
.pandora-hint {
  font-size: 9px;
  color: var(--faint);
  letter-spacing: 0.08em;
  white-space: nowrap;
}

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.toast {
  position: fixed; bottom: 16px; right: 16px;
  background: var(--surface2); border: 1px solid var(--amber-dim); color: var(--amber);
  font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.06em;
  padding: 8px 14px; border-radius: 2px; opacity: 0; transform: translateY(6px);
  transition: opacity 0.2s, transform 0.2s; z-index: 9998; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

@keyframes fadeUp { from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none} }
.sidebar > * { animation: fadeUp 0.3s ease both; }
.main-col > * { animation: fadeUp 0.35s ease both; }

/* ── MOBILE ── */

@media (max-width: 600px) {
  body { overflow: auto; height: auto; font-size: 14px; }

  .app {
    display: flex;
    flex-direction: column;
    height: auto;
    min-height: 100vh;
  }

  /* Reorder: sidebar first (timer+tasks), then chores, then sleep+movement */
  .sidebar {
    border-right: none;
    border-bottom: 1px solid var(--border);
    overflow: visible;
    order: 1;
  }

  .main-col {
    overflow: visible;
    order: 2;
    display: flex;
    flex-direction: column;
  }

  /* Chores floats to top of main col */
  .chores-section { order: 1; }
  .sec-head:has(+ .chores-section) { order: 1; }

  /* Sleep and movement go below */
  .sleep-wrap { order: 3; }
  .move-strip { order: 4; }

  /* Kill fixed heights everywhere */
  .task-panel,
  .task-scroll,
  .chores-section,
  .chore-scroll { height: auto; overflow: visible; min-height: unset; flex: none; }

  /* Top bar */
  .top-bar { padding: 14px 18px 12px; }
  .logo { font-size: 20px; }
  .hdate { font-size: 11px; }
  .anchor { font-size: 11px; }

  /* Sync bar */
  .sync-bar { padding: 5px 18px; font-size: 10px; }

  /* Timer — bigger on mobile */
  .timer-wrap { padding: 20px 18px 16px; }
  .timer-num { font-size: 80px; }
  .timer-focus-lbl { font-size: 12px; margin-bottom: 14px; }
  .pre-btn { font-size: 12px; padding: 5px 12px; }
  .t-btn { font-size: 16px; padding: 10px 20px; }
  .t-task-in { font-size: 14px; padding: 9px 12px; margin-bottom: 10px; }
  .t-bar { height: 3px; }

  /* Sec heads */
  .sec-head { padding: 10px 18px 8px; font-size: 11px; }

  /* Tasks */
  .task-add { border-bottom: 1px solid var(--border); }
  .task-in { font-size: 14px; padding: 12px 16px; }
  .btn-add-t { font-size: 24px; padding: 0 16px; }
  .task-item { padding: 11px 18px; gap: 10px; }
  .t-chk { width: 16px; height: 16px; }
  .t-name { font-size: 13px; }
  .t-focus-btn { opacity: 1; font-size: 10px; padding: 3px 7px; }
  .t-del { opacity: 0.35; font-size: 16px; }
  .task-foot { padding: 10px 18px; }
  .btn-clear-t { font-size: 11px; padding: 6px 12px; }

  /* Movement strip — stack 2x2 */
  .move-strip { flex-wrap: wrap; }
  .m-stat { flex: 1 1 45%; border-right: none; border-bottom: 1px solid var(--border); padding: 12px 18px; }
  .m-stat:last-child { flex: 1 1 100%; border-bottom: none; }
  .m-in { font-size: 28px; }
  .m-lbl { font-size: 10px; }
  .m-unit { font-size: 10px; }

  /* Sleep */
  .sleep-wrap { padding: 16px 18px; }
  .sleep-grid { gap: 12px; margin-bottom: 14px; }
  .sl-field input { font-size: 20px; padding: 6px 10px; }
  .q-dot { width: 30px; height: 30px; font-size: 14px; }
  .sl-note { font-size: 13px; padding: 8px 10px; }
  .btn-log-sl { font-size: 14px; padding: 0 14px; }
  .sl-rec { font-size: 12px; padding: 6px 0; }
  .sl-h { font-size: 18px; }

  /* Chores */
  .chore-add-row { border-bottom: 1px solid var(--border); }
  .chore-in { font-size: 14px; padding: 12px 16px; }
  .btn-add-c { font-size: 24px; padding: 0 16px; }
  .chore-item { padding: 11px 18px; gap: 10px; }
  .c-chk { width: 16px; height: 16px; }
  .c-name { font-size: 13px; }
  .c-del { opacity: 0.35; font-size: 15px; }
  .chore-foot { padding: 10px 18px; }
  .btn-clear-c { font-size: 11px; padding: 6px 12px; }
  .chore-hint { font-size: 10px; }
  .drag-handle span { width: 14px; }

  /* Toast */
  .toast { bottom: 12px; right: 12px; left: 12px; text-align: center; font-size: 12px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="top-bar">
      <span class="logo">CMD</span>
      <span class="hdate" id="hdate"></span>
      <span class="anchor">vir certus</span>
    </div>
    <div class="sync-bar">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncLabel">connecting…</span>
    </div>
    <div class="sec-head">Focus Timer</div>
    <div class="timer-wrap">
      <div class="timer-num" id="timerNum">25:00</div>
      <div class="timer-focus-lbl" id="timerLbl">—</div>
      <div class="presets">
        <button class="pre-btn on" data-m="25">25m</button>
        <button class="pre-btn" data-m="45">45m</button>
        <button class="pre-btn" data-m="52">52m</button>
        <button class="pre-btn" data-m="90">90m</button>
      </div>
      <div class="t-controls">
        <button class="t-btn t-start" id="tStart">START</button>
        <button class="t-btn t-pause" id="tPause">PAUSE</button>
        <button class="t-btn t-reset" id="tReset">RESET</button>
      </div>
      <input type="text" class="t-task-in" id="tTaskIn" placeholder="What are you working on?">
      <div class="t-bar"><div class="t-fill" id="tFill"></div></div>
    </div>
    <div class="sec-head">Task Capture <span class="badge" id="taskBadge"></span></div>
    <div class="task-panel">
      <div class="task-add">
        <input type="text" class="task-in" id="taskIn" placeholder="Capture anything…">
        <button class="btn-add-t" id="addTaskBtn">+</button>
      </div>
      <div class="task-scroll" id="taskScroll"></div>
      <div class="task-foot">
        <button class="btn-clear-t" id="clearTasksBtn">Clear done</button>
      </div>
    </div>

    <div class="sec-head">Music</div>
    <div class="pandora-panel">
      <a href="pandora://" class="pandora-btn" title="Open Pandora">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="pandora-icon">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z" fill="currentColor"/>
        </svg>
        <span class="pandora-label">Open Pandora</span>
      </a>
      <div class="pandora-hint">opens desktop app</div>
    </div>

  </div>
    <div class="move-strip" style="order:4;">
      <div class="m-stat">
        <div class="m-lbl">Steps</div>
        <input type="number" class="m-in" id="mSteps" placeholder="—">
        <div class="m-unit">TODAY</div>
      </div>
      <div class="m-stat">
        <div class="m-lbl">Dog Walk</div>
        <input type="number" class="m-in" id="mWalk" placeholder="—">
        <div class="m-unit">MIN</div>
      </div>
      <div class="m-stat">
        <div class="m-lbl">Ride</div>
        <input type="number" class="m-in" id="mRide" placeholder="—">
        <div class="m-unit">KM</div>
      </div>
      <div class="m-stat">
        <div class="m-lbl">Notes</div>
        <input type="text" class="m-in" style="font-size:13px;" id="mNotes" placeholder="—">
        <div class="m-unit">OPTIONAL</div>
      </div>
    </div>
    <div class="sec-head" style="order:3;">Sleep Log</div>
    <div class="sleep-wrap" style="order:3;">
      <div class="sleep-grid">
        <div class="sl-field"><label>Lights Out</label><input type="time" id="slBed"></div>
        <div class="sl-field"><label>Wake Up</label><input type="time" id="slWake"></div>
        <div class="sl-field"><label>Hours</label><input type="text" id="slHrs" placeholder="—" readonly style="color:var(--green);cursor:default;"></div>
      </div>
      <div class="q-row">
        <span class="q-lbl">Quality</span>
        <div class="q-dot" data-q="1">😮‍💨</div>
        <div class="q-dot" data-q="2">😑</div>
        <div class="q-dot" data-q="3">😐</div>
        <div class="q-dot" data-q="4">🙂</div>
        <div class="q-dot" data-q="5">😌</div>
      </div>
      <div class="sl-bot">
        <textarea class="sl-note" id="slNote" rows="2" placeholder="Any notes…"></textarea>
        <button class="btn-log-sl" id="logSlBtn">LOG</button>
      </div>
      <div class="sl-history" id="slHistory"></div>
    </div>
    <div class="sec-head" style="order:1;">Chore List <span class="badge" id="choreBadge"></span></div>
    <div class="chores-section" style="order:2;">
      <div class="chore-add-row">
        <input type="text" class="chore-in" id="choreIn" placeholder="Add a chore…">
        <button class="btn-add-c" id="addChoreBtn">+</button>

      <div class="chore-scroll">
        <ul class="chore-list" id="choreList"></ul>
      </div>
      <div class="chore-foot">
        <button class="btn-clear-c" id="clearDoneChores">Clear done</button>
        <span class="chore-hint">drag to reorder</span>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ─── CONFIG ───
const SB_URL  = 'https://zqdmxywinwbxhrrrqcrx.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxZG14eXdpbndieGhycnJxY3J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNjU1MTksImV4cCI6MjA5Mzk0MTUxOX0.yEkHrArXalsuSNNR5ipWlYZ7d6mvhIrgPjqnlkE_rTM';

const sb = supabase.createClient(SB_URL, SB_ANON);

// ─── STATE ───
let S = { tasks: [], sleep: [], chores: [], move: {} };

// ─── SYNC ───
let _syncTimer = null;

function setSync(state, msg) {
  document.getElementById('syncDot').className = 'sync-dot ' + state;
  document.getElementById('syncLabel').textContent = msg;
}

async function pushKey(key) {
  try {
    setSync('syncing', 'syncing…');
    const { error } = await sb.from('cmd_state').upsert(
      { key, value: S[key], updated_at: new Date().toISOString() },
      { onConflict: 'key' }
    );
    if (error) {
      console.error('Supabase push error:', error);
      setSync('err', `error: ${error.message}`);
      return;
    }
    setSync('ok', 'synced ' + new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
  } catch(e) {
    console.error('Supabase push exception:', e);
    setSync('err', 'offline — saved locally');
  }
}

function sync(key) {
  saveLocal();
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(() => pushKey(key), 600);
}

async function pullAll() {
  try {
    setSync('syncing', 'loading…');
    const { data, error } = await sb.from('cmd_state').select('key, value');
    if (error) {
      console.error('Supabase pull error:', error);
      setSync('err', `load error: ${error.message}`);
      loadLocal();
      return false;
    }
    console.log('Pulled rows:', data);
    data.forEach(r => { if (r.key in S && r.value !== null) S[r.key] = r.value; });
    setSync('ok', 'synced ' + new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
    return true;
  } catch(e) {
    console.error('Supabase pull exception:', e);
    setSync('err', 'offline — using local data');
    loadLocal();
    return false;
  }
}

function saveLocal() {
  try { localStorage.setItem('cmd_local', JSON.stringify(S)); } catch {}
}
function loadLocal() {
  try {
    const d = JSON.parse(localStorage.getItem('cmd_local') || '{}');
    ['tasks','sleep','chores','move'].forEach(k => { if (d[k]) S[k] = d[k]; });
  } catch {}
}

// ─── UTILS ───
const now = new Date();
document.getElementById('hdate').textContent = now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

let _tt;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(()=>el.classList.remove('show'), 2400);
}
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// ─── TIMER ───
let tM=25,tS=0,tTotal=1500,tIv=null,tRun=false;
const tNum=document.getElementById('timerNum');
const tFill=document.getElementById('tFill');
const tLbl=document.getElementById('timerLbl');
const tIn=document.getElementById('tTaskIn');

tIn.addEventListener('input',()=>{ tLbl.textContent=tIn.value.trim()||'—'; });

document.querySelectorAll('.pre-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    if(tRun) return;
    document.querySelectorAll('.pre-btn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    tM=parseInt(b.dataset.m); tS=0; tTotal=tM*60;
    updT(); tFill.style.width='0%';
  });
});

function updT(){ tNum.textContent=`${String(tM).padStart(2,'0')}:${String(tS).padStart(2,'0')}`; }

function tick(){
  if(tM===0&&tS===0){
    clearInterval(tIv); tRun=false;
    tNum.classList.remove('running'); tNum.classList.add('done');
    tFill.style.width='100%';
    toast('Session complete. Late is not lost.'); return;
  }
  if(tS===0){tM--;tS=59;}else tS--;
  updT();
  tFill.style.width=`${((tTotal-(tM*60+tS))/tTotal)*100}%`;
}

document.getElementById('tStart').addEventListener('click',()=>{
  if(tRun) return; tRun=true;
  tNum.classList.add('running'); tNum.classList.remove('done');
  tIv=setInterval(tick,1000);
});
document.getElementById('tPause').addEventListener('click',()=>{
  if(!tRun) return; clearInterval(tIv); tRun=false; tNum.classList.remove('running');
});
document.getElementById('tReset').addEventListener('click',()=>{
  clearInterval(tIv); tRun=false; tNum.classList.remove('running','done');
  const a=document.querySelector('.pre-btn.on');
  tM=a?parseInt(a.dataset.m):25; tS=0; tTotal=tM*60;
  updT(); tFill.style.width='0%';
});

// ─── TASKS ───
function addTask(){
  const name=document.getElementById('taskIn').value.trim();
  if(!name) return;
  S.tasks.push({name,done:false,id:Date.now()});
  sync('tasks'); document.getElementById('taskIn').value=''; renderTasks();
}
document.getElementById('addTaskBtn').addEventListener('click',addTask);
document.getElementById('taskIn').addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});
document.getElementById('clearTasksBtn').addEventListener('click',()=>{
  S.tasks=S.tasks.filter(t=>!t.done); sync('tasks'); renderTasks();
});

function renderTasks(){
  const tasks=S.tasks||[];
  const open=tasks.filter(t=>!t.done).length;
  document.getElementById('taskBadge').textContent=open?`${open} open`:tasks.length?'all done':'';
  const el=document.getElementById('taskScroll');
  if(!tasks.length){ el.innerHTML='<div style="padding:12px 16px;color:var(--faint);font-style:italic;font-size:10px;">Nothing captured yet.</div>'; return; }
  el.innerHTML=tasks.map(t=>`
    <div class="task-item ${t.done?'done':''}" data-id="${t.id}">
      <div class="t-chk"></div>
      <span class="t-name">${esc(t.name)}</span>
      ${!t.done?`<button class="t-focus-btn" data-n="${esc(t.name)}">▶ focus</button>`:''}
      <span class="t-del" data-id="${t.id}">✕</span>
    </div>`).join('');
  el.querySelectorAll('.task-item').forEach(item=>{
    item.addEventListener('click',e=>{
      if(e.target.classList.contains('t-del')||e.target.classList.contains('t-focus-btn')) return;
      const t=S.tasks.find(t=>t.id==item.dataset.id);
      if(t){t.done=!t.done; sync('tasks'); renderTasks();}
    });
  });
  el.querySelectorAll('.t-del').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      S.tasks=S.tasks.filter(t=>t.id!=btn.dataset.id); sync('tasks'); renderTasks();
    });
  });
  el.querySelectorAll('.t-focus-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      tIn.value=btn.dataset.n; tLbl.textContent=btn.dataset.n;
      toast('Loaded into timer. Start when ready.');
    });
  });
}

// ─── MOVEMENT ───
function loadMove(){
  const m=S.move||{};
  if(m.date===now.toDateString()){
    ['mSteps','mWalk','mRide','mNotes'].forEach(id=>{ document.getElementById(id).value=m[id]||''; });
  }
}
function saveMove(){
  S.move={date:now.toDateString(),mSteps:document.getElementById('mSteps').value,mWalk:document.getElementById('mWalk').value,mRide:document.getElementById('mRide').value,mNotes:document.getElementById('mNotes').value};
  sync('move');
}
['mSteps','mWalk','mRide','mNotes'].forEach(id=>document.getElementById(id).addEventListener('input',saveMove));

// ─── SLEEP ───
let slQ=null;
const slBed=document.getElementById('slBed'),slWake=document.getElementById('slWake'),slHrs=document.getElementById('slHrs');

function calcHrs(){
  if(!slBed.value||!slWake.value){slHrs.value='';return;}
  const[bh,bm]=slBed.value.split(':').map(Number);
  const[wh,wm]=slWake.value.split(':').map(Number);
  let m=(wh*60+wm)-(bh*60+bm); if(m<0)m+=1440;
  slHrs.value=(m/60).toFixed(1)+'h';
}
slBed.addEventListener('change',calcHrs);
slWake.addEventListener('change',calcHrs);

document.querySelectorAll('.q-dot').forEach(d=>{
  d.addEventListener('click',()=>{ document.querySelectorAll('.q-dot').forEach(x=>x.classList.remove('on')); d.classList.add('on'); slQ=d.dataset.q; });
});

document.getElementById('logSlBtn').addEventListener('click',()=>{
  if(!slBed.value&&!slWake.value) return;
  const emj=['😮‍💨','😑','😐','🙂','😌'];
  S.sleep.unshift({date:now.toLocaleDateString('en-US',{month:'short',day:'numeric'}),hrs:slHrs.value||'—',q:slQ?emj[slQ-1]:'',note:document.getElementById('slNote').value.trim(),id:Date.now()});
  sync('sleep');
  slBed.value='';slWake.value='';slHrs.value='';document.getElementById('slNote').value='';
  document.querySelectorAll('.q-dot').forEach(d=>d.classList.remove('on'));slQ=null;
  renderSleep();toast('Sleep logged.');
});

function renderSleep(){
  const log=S.sleep||[];
  const el=document.getElementById('slHistory');
  if(!log.length){el.innerHTML='';return;}
  el.innerHTML=log.slice(0,5).map(s=>`
    <div class="sl-rec">
      <span class="sl-dt">${s.date}</span><span class="sl-h">${s.hrs}</span>
      <span class="sl-q">${s.q}</span><span class="sl-n">${esc(s.note||'')}</span>
      <span class="sl-x" data-id="${s.id}">✕</span>
    </div>`).join('');
  el.querySelectorAll('.sl-x').forEach(btn=>{
    btn.addEventListener('click',()=>{ S.sleep=S.sleep.filter(s=>s.id!=btn.dataset.id); sync('sleep'); renderSleep(); });
  });
}

// ─── CHORES ───
let dragSrc=null;

function addChore(){
  const name=document.getElementById('choreIn').value.trim();
  if(!name) return;
  S.chores.push({id:Date.now(),name,done:false});
  sync('chores'); document.getElementById('choreIn').value=''; renderChores();
}
document.getElementById('addChoreBtn').addEventListener('click',addChore);
document.getElementById('choreIn').addEventListener('keydown',e=>{if(e.key==='Enter')addChore();});
document.getElementById('clearDoneChores').addEventListener('click',()=>{
  S.chores=S.chores.filter(c=>!c.done); sync('chores'); renderChores();
});

function renderChores(){
  const chores=S.chores||[];
  const done=chores.filter(c=>c.done).length;
  document.getElementById('choreBadge').textContent=chores.length?`${done}/${chores.length}`:'';
  const list=document.getElementById('choreList');
  if(!chores.length){
    list.innerHTML='<li style="padding:12px 16px;color:var(--faint);font-style:italic;font-size:10px;">No chores yet.</li>';
    return;
  }
  list.innerHTML=chores.map(c=>`
    <li class="chore-item ${c.done?'done':''}" data-id="${c.id}" draggable="true">
      <div class="drag-handle"><span></span><span></span><span></span></div>
      <div class="c-chk"></div>
      <span class="c-name">${esc(c.name)}</span>
      <span class="c-del" data-id="${c.id}">✕</span>
    </li>`).join('');

  list.querySelectorAll('.chore-item').forEach(item=>{
    item.querySelector('.c-chk').addEventListener('click',e=>{
      e.stopPropagation();
      const c=S.chores.find(c=>c.id==item.dataset.id);
      if(c){c.done=!c.done;sync('chores');renderChores();if(c.done)toast('One degree forward.');}
    });
    item.querySelector('.c-name').addEventListener('click',()=>{
      const c=S.chores.find(c=>c.id==item.dataset.id);
      if(c){c.done=!c.done;sync('chores');renderChores();if(c.done)toast('One degree forward.');}
    });
    item.querySelector('.c-del').addEventListener('click',e=>{
      e.stopPropagation();
      S.chores=S.chores.filter(c=>c.id!=e.target.dataset.id);
      sync('chores');renderChores();
    });
    item.addEventListener('dragstart',e=>{dragSrc=item;item.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    item.addEventListener('dragend',()=>{
      item.classList.remove('dragging');
      list.querySelectorAll('.chore-item').forEach(i=>i.classList.remove('drag-over'));
      dragSrc=null;
    });
    item.addEventListener('dragover',e=>{
      e.preventDefault();
      if(item!==dragSrc){list.querySelectorAll('.chore-item').forEach(i=>i.classList.remove('drag-over'));item.classList.add('drag-over');}
    });
    item.addEventListener('dragleave',()=>item.classList.remove('drag-over'));
    item.addEventListener('drop',e=>{
      e.preventDefault();
      if(!dragSrc||dragSrc===item) return;
      item.classList.remove('drag-over');
      const si=parseInt(dragSrc.dataset.id),ti=parseInt(item.dataset.id);
      const sIdx=S.chores.findIndex(c=>c.id===si),tIdx=S.chores.findIndex(c=>c.id===ti);
      if(sIdx===-1||tIdx===-1) return;
      const[moved]=S.chores.splice(sIdx,1);
      S.chores.splice(tIdx,0,moved);
      sync('chores');renderChores();
    });
  });
}

// ─── BOOT ───
async function boot(){
  await pullAll();

  // Seed default chores only if completely empty
  if(!S.chores||!S.chores.length){
    S.chores=[
      {id:1,name:'Vacuum main floor',done:false},
      {id:2,name:'Wipe counters',done:false},
      {id:3,name:'Take out trash',done:false},
      {id:4,name:'Mop kitchen',done:false},
      {id:5,name:'Laundry',done:false},
      {id:6,name:'Bathrooms',done:false},
    ];
    sync('chores');
  }

  loadMove();
  renderTasks();
  renderSleep();
  renderChores();
}

boot();
</script>
